server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # SvelteKit's static adapter emits a small inline module bootstrap and the
    # Google WOFF2 Emscripten glue uses Function construction during startup.
    # A nonce cannot be generated by this deliberately backend-free deployment,
    # so the CSP permits those local bootstrap paths while every remote source
    # remains disallowed.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' blob:; font-src 'self' data:; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 365d;
        try_files $uri =404;
    }

    location ^~ /_app/ {
        expires 365d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /200.html;
    }
}
